<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>잠입 라이브</title>
    <meta name="description" content="사이비 집회에 신도로 잠입한 유튜버가 되어 폰을 들었다 내렸다 하며 들키지 않고 증거를 찍는 1인칭 잠입 게임">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
      :root {
        --bg: #0b0b0d;
        --ink: #f2efe9;
        --muted: rgba(242, 239, 233, 0.56);
        --line: rgba(242, 239, 233, 0.14);
        --accent: #d8b27a;
        --rec: #e5484d;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
      body { font-family: "Pretendard", -apple-system, "Apple SD Gothic Neo", sans-serif; -webkit-font-smoothing: antialiased; }
      #stage { position: fixed; inset: 0; display: grid; place-items: center; }
      #unity-canvas { display: block; background: #000; outline: none; }
      #overlay {
        position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
        background: radial-gradient(ellipse at 50% 40%, rgba(11, 11, 13, 0.72), rgba(11, 11, 13, 0.96) 70%);
        transition: opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #overlay.ready { pointer-events: none; }
      #overlay.gone { opacity: 0; }
      .card { width: min(560px, 100%); }
      .live { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }
      .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--rec); animation: blink 1.4s steps(2, start) infinite; }
      @keyframes blink { to { visibility: hidden; } }
      h1 { margin: 14px 0 12px; font-size: clamp(40px, 7vw, 64px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
      .lede { margin: 0 0 28px; font-size: 16px; line-height: 1.65; color: var(--muted); word-break: keep-all; }
      .lede b { color: var(--ink); font-weight: 600; }
      dl { margin: 0 0 30px; display: grid; grid-template-columns: max-content 1fr; gap: 9px 18px; font-size: 14px; line-height: 1.4; }
      dt { color: var(--accent); font-weight: 600; white-space: nowrap; }
      dd { margin: 0; color: var(--muted); word-break: keep-all; }
      .bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
      .bar span { display: block; height: 100%; width: 0; background: var(--ink); transition: width 0.2s linear; }
      #status { margin-top: 12px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.4em; }
      #overlay.ready #status { color: var(--ink); font-weight: 600; }
      #overlay.ready .bar { display: none; }
      button { margin-top: 14px; font: inherit; font-size: 14px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; cursor: pointer; }
      button:hover { border-color: var(--muted); }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
    </div>
    <div id="overlay">
      <div class="card">
        <span class="live"><i></i>LIVE</span>
        <h1>잠입 라이브</h1>
        <p class="lede">사이비 집회에 신도인 척 들어간 유튜버가 됩니다. <b>맨눈엔 평온한 집회가, 숨긴 폰엔 다른 것이</b> 찍힙니다. 들키지 않고 찍어서 집회가 끝날 때까지 버티세요.</p>
        <dl>
          <dt>우클릭</dt><dd>폰 들기 · 내리기</dd>
          <dt>E</dt><dd>몰래 찍기</dd>
          <dt>Esc</dt><dd>멈춤</dd>
        </dl>
        <div class="bar"><span id="progress"></span></div>
        <div id="status">불러오는 중</div>
        <button id="load-anyway" class="hidden" type="button">그래도 불러오기</button>
      </div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.getElementById("unity-canvas");
      var overlay = document.getElementById("overlay");
      var statusEl = document.getElementById("status");
      var progressEl = document.getElementById("progress");

      function fit() {
        var w = window.innerWidth, h = window.innerHeight;
        var cw = w, ch = Math.round(w * 9 / 16);
        if (ch > h) { ch = h; cw = Math.round(h * 16 / 9); }
        canvas.style.width = cw + "px";
        canvas.style.height = ch + "px";
      }
      window.addEventListener("resize", fit);
      fit();

      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      canvas.addEventListener("mousedown", function () { canvas.focus(); });
      overlay.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      function start() {
        createUnityInstance(canvas, {
          arguments: [],
#if PROGRESSIVE_ASSET_LOADING
          primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
          secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
          dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
          frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
          codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
          symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
          streamingAssetsUrl: "StreamingAssets",
          companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
          productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
          productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
          showBanner: function (msg, type) { if (type === "error") statusEl.textContent = msg; },
        }, function (p) {
          progressEl.style.width = Math.round(p * 100) + "%";
          statusEl.textContent = "불러오는 중 " + Math.round(p * 100) + "%";
        }).then(function () {
          // 게임 안에 메인 화면이 있으니 클릭을 기다리지 않고 바로 걷는다
          overlay.classList.add("ready");
          statusEl.textContent = "준비 완료";
          progressEl.style.width = "100%";
          canvas.focus();
          requestAnimationFrame(function () { overlay.classList.add("gone"); });
          setTimeout(function () { overlay.classList.add("hidden"); }, 400);
        }).catch(function (message) {
          statusEl.textContent = "불러오지 못했습니다: " + message;
        });
      }

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        statusEl.textContent = "마우스와 키보드가 필요한 게임이라 PC 브라우저에서 열어 주세요.";
        document.querySelector(".bar").classList.add("hidden");
        var btn = document.getElementById("load-anyway");
        btn.classList.remove("hidden");
        btn.addEventListener("click", function () {
          btn.classList.add("hidden");
          document.querySelector(".bar").classList.remove("hidden");
          start();
        });
      } else {
        start();
      }
    </script>
  </body>
</html>
